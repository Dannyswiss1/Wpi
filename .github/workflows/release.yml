name: Release Contracts

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release Artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88.0"
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            Stellar-contracts-v1/target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('Stellar-contracts-v1/Cargo.lock') }}

      - name: Build contracts (wasm32, release)
        working-directory: Stellar-contracts-v1
        run: cargo build --locked --target wasm32-unknown-unknown --release

      - name: Generate SHA-256 Checksums
        shell: bash
        run: |
          cd Stellar-contracts-v1/target/wasm32-unknown-unknown/release
          sha256sum wpi_token.wasm mock_amm.wasm > SHA256SUMS
          cat SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Stellar-contracts-v1/target/wasm32-unknown-unknown/release/wpi_token.wasm
            Stellar-contracts-v1/target/wasm32-unknown-unknown/release/mock_amm.wasm
            Stellar-contracts-v1/target/wasm32-unknown-unknown/release/SHA256SUMS
          draft: true
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
